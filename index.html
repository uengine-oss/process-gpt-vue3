<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script>
        // 휴대폰 브라우저에서도 기본은 데스크톱 화면이다 — 브라우저의 「데스크톱 사이트 요청」처럼 화면 폭을
        // 1280px 로 잡아, 폭으로 모바일 여부를 정하는 화면들(globalIsMobile 등)이 모두 데스크톱으로 그린다.
        // 기기 폭(간소화한 모바일 화면) 그대로 두는 경우:
        //   - 라이트 버전을 고른 사람(localStorage mobileView=light — 설정 › 테마 설정 「휴대폰 화면」)
        //   - 네이티브 앱(process-gpt-mobile, Capacitor) — 앱은 지금처럼 모바일 화면
        //   - 랜딩(/) · 로그인(/auth/*) · 외부 폼(/external-forms/*) — 반응형이라 기기 폭이 낫다
        //   - PAL · uEngine 모드 — run.sh 가 head 첫머리에 넣는 window._env_ 로 알고, 빌드 때 정한 모드는
        //     main.ts 가 disable() 로 끈다
        // 앱은 이 규칙을 window.__pgptViewport 로만 쓴다(src/shared/mobileView). 규칙을 두 곳에 두지 않는다.
        (function () {
            var KEY = 'mobileView';
            var DESKTOP_WIDTH = 1280;
            var env = window._env_ || {};
            var enabled = (!env.VITE_MODE || env.VITE_MODE === 'ProcessGPT') && String(env.VITE_PAL_MODE) !== 'true';
            var meta = document.querySelector('meta[name="viewport"]');
            var deviceContent = meta.getAttribute('content');
            function isNativeApp() {
                var c = window.Capacitor;
                return !!(c && (typeof c.isNativePlatform === 'function' ? c.isNativePlatform() : c.isNative));
            }
            function isPhoneBrowser() {
                var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
                return coarse && Math.min(screen.width, screen.height) <= 768 && !isNativeApp();
            }
            function view() {
                try { return localStorage.getItem(KEY); } catch (e) { return null; }
            }
            function isDeviceWidthPath(path) {
                return path === '/' || path.indexOf('/auth/') === 0 || path.indexOf('/external-forms/') === 0;
            }
            var api = {
                KEY: KEY,
                isEnabled: function () { return enabled; },
                isPhoneBrowser: isPhoneBrowser,
                isDeviceWidthPath: isDeviceWidthPath,
                view: view,
                wantsDesktop: function (path) {
                    return enabled && isPhoneBrowser() && view() !== 'light' && !isDeviceWidthPath(path);
                },
                disable: function () {
                    enabled = false;
                    api.apply(location.pathname);
                },
                desktop: false,
                apply: function (path) {
                    api.desktop = api.wantsDesktop(path);
                    meta.setAttribute('content', api.desktop ? 'width=' + DESKTOP_WIDTH + ', viewport-fit=cover' : deviceContent);
                    document.documentElement.setAttribute('data-viewport', api.desktop ? 'desktop' : 'device');
                }
            };
            window.__pgptViewport = api;
            api.apply(location.pathname);
        })();
    </script>
    <link rel="stylesheet" href="/static/lib/css2.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!--
      레거시 전역 스크립트 정리 (기존 첫 로드 블로킹 약 3.7 MB)

      1) 아래 무거운 자산은 실제로 쓰는 화면에서만 `@/utils/legacyAssets` 로 불러온다.
         - CKEditor4 + Bootstrap3 + KEditor (약 1.25 MB) → 폼 디자이너: ensureFormDesigner()
         - OpenGraph-0.1.3-SNAPSHOT (1.3 MB)            → 레거시 캔버스: ensureOpenGraphLib()
      2) 아래 두 스크립트는 `type="javascript"` 라 브라우저가 애초에 실행한 적이 없어 삭제했다.
         /static/lib/jqueryXML2JSON/jquery.xml2json.js, /static/slimscroll/jquery.slimscroll.min.js
      3) jQuery / jQuery-UI / lodash 는 아직 전역(`$`, `_`)으로 쓰는 컴포넌트가 많아 남겨두되,
         `defer` 로 바꿔 HTML 파싱을 막지 않게 했다. defer 스크립트는 문서 순서대로,
         모듈 스크립트(main.ts)보다 먼저 실행되므로 전역 정의 순서는 그대로 보장된다.
    -->
    <script defer src="/static/lib/jquery.min.js"></script>
    <script defer src="/static/lib/jquery-ui.min.js"></script>
    <script defer src="/static/lib/lodash.min.js"></script>
    <link href="/static/lib/materialdesignicons.min.css" rel="stylesheet">
    <link href="/static/bpmn/css/bpmn.css" rel="stylesheet" type="text/css" />
    <script type="text/javascript">
        // localhost에서는 Clarity 추적 차단
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            (function(c,l,a,r,i,t,y){
                c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
            })(window, document, "clarity", "script", "s492xd702j");
        }
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script src="/static/config.js"></script>
    <script>
      // 조건에 따라 제목 및 파비콘 변경
      document.addEventListener("DOMContentLoaded", function () {
        // 전역 변수 $mode의 값을 확인
        var mode = window.$mode || 'ProcessGPT'; // 기본값을 'ProcessGPT'로 설정

        if (mode === 'uEngine') {
          // 제목 변경
          document.title = "uEngine6-bpm";
          // 파비콘 변경
          var link = document.querySelector("link[rel~='icon']");
          if (link) {
            link.href = "/uengine6-bpm-favicon.png";
          }
        } else {
          // 제목 변경
          document.title = "Process-GPT";
          // 파비콘 변경
          var link = document.querySelector("link[rel~='icon']");
          if (link) {
            link.href = "/process-gpt-favicon.png";
          }
        }
      });
    </script>
</body>
</html>
