apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: ohsy818@uengine.org
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - dns01:
        route53:
          # Access Key ID도 Secret에서 읽는다 (매니페스트에 키 식별자를 두지 않음)
          accessKeyIDSecretRef:
            key: accessKeyID
            name: route53-credentials
          region: us-east-1
          role: arn:aws:iam::979050235289:role/cert-manager
          secretAccessKeySecretRef:
            key: secretAccessKey
            name: route53-credentials
      selector:
        dnsZones:
        - process-gpt.io