apiVersion: apps/v1
kind: Deployment
metadata:
  name: memento-deployment
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: memento
  template:
    metadata:
      labels:
        app: memento
    spec:
      # 보안 기본값 (Trivy KSV-0118): seccomp 기본 프로파일
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: memento
        image: ghcr.io/uengine-oss/process-gpt-memento:16cfe7f
        # 보안 기본값 (Trivy KSV-0014/0118): 읽기 전용 루트 FS, 권한 상승·커널 권한 제거
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8005
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-secret
              key: OPENAI_API_KEY
        - name: SUPABASE_URL
          valueFrom:
            configMapKeyRef:
              name: my-config
              key: SUPABASE_URL
        - name: SUPABASE_KEY
          valueFrom:
            secretKeyRef:
              name: my-secrets
              key: SERVICE_ROLE_KEY
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/secrets/credentials.json"
        - name: GOOGLE_DRIVE_FOLDER_ID
          valueFrom:
            configMapKeyRef:
              name: my-config
              key: GOOGLE_DRIVE_FOLDER_ID
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: google-credentials
          mountPath: "/secrets"
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: google-credentials
        secret:
          secretName: google-credentials
