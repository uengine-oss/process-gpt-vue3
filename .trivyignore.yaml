# Trivy 예외 목록 — 경로 한정, 사유·만료일 필수.
# 새 항목을 추가할 때는 docs/security/vuln-scan-report-2026-10.md 의 "예외" 표도 함께 갱신한다.
misconfigurations:
  - id: DS-0002
    paths:
      - "docker-compose/supabase-postgres-age/Dockerfile"
    statement: >-
      supabase/postgres 베이스 이미지의 docker-entrypoint.sh 는 root 로 시작해 데이터 디렉터리
      권한을 맞춘 뒤 gosu 로 postgres 사용자로 강등해 서버를 띄운다. USER 를 바꾸면 새 볼륨
      초기화(initdb)가 실패한다. 실제 DB 프로세스는 root 로 돌지 않는다.
    expired_at: 2027-03-31
